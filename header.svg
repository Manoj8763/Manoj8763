<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes twinkle1 {
        0%,100% { opacity: 0.2; r: 1; }
        50%      { opacity: 1.0; r: 2; }
      }
      @keyframes twinkle2 {
        0%,100% { opacity: 0.8; r: 1.5; }
        50%      { opacity: 0.1; r: 0.8; }
      }
      @keyframes twinkle3 {
        0%,100% { opacity: 0.5; r: 1; }
        50%      { opacity: 1.0; r: 1.8; }
      }
      @keyframes nebulaPulse {
        0%,100% { opacity: 0.25; }
        50%      { opacity: 0.45; }
      }
      @keyframes titleGlow {
        0%,100% { filter: drop-shadow(0 0 8px #9B59FF) drop-shadow(0 0 20px #7928CA); }
        50%      { filter: drop-shadow(0 0 18px #BF8FFF) drop-shadow(0 0 40px #9B59FF); }
      }
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes shootingStar {
        0%   { opacity: 0; transform: translate(0,0); }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { opacity: 0; transform: translate(120px, 40px); }
      }
      .s1  { animation: twinkle1 2.1s ease-in-out infinite; animation-delay: 0.0s; }
      .s2  { animation: twinkle2 1.8s ease-in-out infinite; animation-delay: 0.3s; }
      .s3  { animation: twinkle3 2.5s ease-in-out infinite; animation-delay: 0.7s; }
      .s4  { animation: twinkle1 1.6s ease-in-out infinite; animation-delay: 1.1s; }
      .s5  { animation: twinkle2 2.3s ease-in-out infinite; animation-delay: 0.5s; }
      .s6  { animation: twinkle3 2.7s ease-in-out infinite; animation-delay: 1.4s; }
      .s7  { animation: twinkle1 1.9s ease-in-out infinite; animation-delay: 0.2s; }
      .s8  { animation: twinkle2 2.4s ease-in-out infinite; animation-delay: 0.9s; }
      .s9  { animation: twinkle3 2.0s ease-in-out infinite; animation-delay: 1.6s; }
      .s10 { animation: twinkle1 2.6s ease-in-out infinite; animation-delay: 0.4s; }
      .s11 { animation: twinkle2 1.7s ease-in-out infinite; animation-delay: 1.2s; }
      .s12 { animation: twinkle3 2.2s ease-in-out infinite; animation-delay: 0.6s; }
      .s13 { animation: twinkle1 2.8s ease-in-out infinite; animation-delay: 1.8s; }
      .s14 { animation: twinkle2 1.5s ease-in-out infinite; animation-delay: 0.1s; }
      .s15 { animation: twinkle3 2.9s ease-in-out infinite; animation-delay: 1.3s; }
      .s16 { animation: twinkle1 2.0s ease-in-out infinite; animation-delay: 0.8s; }
      .s17 { animation: twinkle2 2.3s ease-in-out infinite; animation-delay: 1.5s; }
      .s18 { animation: twinkle3 1.8s ease-in-out infinite; animation-delay: 0.4s; }
      .s19 { animation: twinkle1 2.5s ease-in-out infinite; animation-delay: 1.0s; }
      .s20 { animation: twinkle2 2.1s ease-in-out infinite; animation-delay: 1.7s; }
      .nebula { animation: nebulaPulse 4s ease-in-out infinite; }
      .title  { animation: titleGlow 3.5s ease-in-out infinite; }
      .sub    { animation: fadeUp 1.4s ease-out forwards; animation-delay: 0.5s; opacity: 0; }
      .shoot  { animation: shootingStar 6s linear infinite; animation-delay: 2s; }
      .shoot2 { animation: shootingStar 8s linear infinite; animation-delay: 5s; }
    </style>

    <!-- Deep space background gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#05001A"/>
      <stop offset="40%"  stop-color="#080028"/>
      <stop offset="100%" stop-color="#020010"/>
    </linearGradient>

    <!-- Purple nebula left -->
    <radialGradient id="nebulaLeft" cx="15%" cy="40%" r="35%">
      <stop offset="0%"   stop-color="#7928CA" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#4A0080" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue nebula right -->
    <radialGradient id="nebulaRight" cx="85%" cy="55%" r="30%">
      <stop offset="0%"   stop-color="#1A3AFF" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#0A1A80" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft pink nebula top center -->
    <radialGradient id="nebulaCenter" cx="50%" cy="20%" r="25%">
      <stop offset="0%"   stop-color="#FF3CAC" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="30%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Title glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="900" height="220" fill="url(#spaceBg)"/>

  <!-- Nebula clouds -->
  <rect class="nebula" width="900" height="220" fill="url(#nebulaLeft)"/>
  <rect class="nebula" width="900" height="220" fill="url(#nebulaRight)" style="animation-delay:2s"/>
  <rect width="900" height="220" fill="url(#nebulaCenter)"/>

  <!-- Stars — white dots of varying sizes -->
  <g fill="white">
    <circle class="s1"  cx="42"  cy="18"  r="1"/>
    <circle class="s2"  cx="130" cy="8"   r="1.5"/>
    <circle class="s3"  cx="215" cy="32"  r="1"/>
    <circle class="s4"  cx="290" cy="12"  r="1.2"/>
    <circle class="s5"  cx="380" cy="25"  r="1"/>
    <circle class="s6"  cx="460" cy="8"   r="1.5"/>
    <circle class="s7"  cx="540" cy="38"  r="1"/>
    <circle class="s8"  cx="620" cy="15"  r="1.2"/>
    <circle class="s9"  cx="710" cy="28"  r="1"/>
    <circle class="s10" cx="790" cy="10"  r="1.5"/>
    <circle class="s11" cx="855" cy="35"  r="1"/>
    <circle class="s12" cx="80"  cy="65"  r="1.2"/>
    <circle class="s13" cx="170" cy="55"  r="1"/>
    <circle class="s14" cx="340" cy="70"  r="1.5"/>
    <circle class="s15" cx="500" cy="60"  r="1"/>
    <circle class="s16" cx="670" cy="72"  r="1.2"/>
    <circle class="s17" cx="820" cy="58"  r="1"/>
    <circle class="s18" cx="25"  cy="150" r="1.2"/>
    <circle class="s19" cx="880" cy="140" r="1"/>
    <circle class="s20" cx="450" cy="195" r="1.5"/>
  </g>

  <!-- Tiny dim stars -->
  <g fill="white" opacity="0.4">
    <circle cx="60"  cy="100" r="0.7"/>
    <circle cx="160" cy="170" r="0.8"/>
    <circle cx="250" cy="50"  r="0.6"/>
    <circle cx="410" cy="180" r="0.7"/>
    <circle cx="560" cy="90"  r="0.8"/>
    <circle cx="730" cy="185" r="0.6"/>
    <circle cx="840" cy="110" r="0.7"/>
    <circle cx="900" cy="70"  r="0.8"/>
    <circle cx="10"  cy="200" r="0.6"/>
    <circle cx="320" cy="200" r="0.7"/>
    <circle cx="650" cy="140" r="0.8"/>
    <circle cx="770" cy="50"  r="0.6"/>
  </g>

  <!-- Shooting star 1 -->
  <g class="shoot" opacity="0.9">
    <line x1="50" y1="20" x2="80" y2="32" stroke="white" stroke-width="1" opacity="0.8"/>
    <circle cx="50" cy="20" r="1.5" fill="white"/>
  </g>

  <!-- Shooting star 2 -->
  <g class="shoot2" opacity="0.9">
    <line x1="700" y1="10" x2="730" y2="25" stroke="white" stroke-width="1" opacity="0.8"/>
    <circle cx="700" cy="10" r="1.5" fill="white"/>
  </g>

  <!-- Vignette -->
  <rect width="900" height="220" fill="url(#vignette)"/>

  <!-- Title -->
  <text class="title" x="450" y="108" text-anchor="middle"
    font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif"
    font-size="48" font-weight="900" letter-spacing="2"
    fill="white" filter="url(#glow)">
    MANOJ KUMAR PARIDA
  </text>

  <!-- Subtitle -->
  <text class="sub" x="450" y="152" text-anchor="middle"
    font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif"
    font-size="15" font-weight="400" letter-spacing="2"
    fill="#C8A4FF">
    ✦  AI Agent Engineer  |  GenAI Architect  |  IIT Kanpur  ✦
  </text>

  <!-- Bottom line -->
  <line x1="250" y1="174" x2="650" y2="174" stroke="#7928CA" stroke-width="0.6" opacity="0.5"/>
</svg>
