    <text class="col6" x="310">0<tspan dy="14" x="310">ホ</tspan><tspan dy="14" x="310">1</tspan><tspan dy="14" x="310">マ</tspan><tspan dy="14" x="310">5</tspan><tspan dy="14" x="310">ミ</tspan><tspan dy="14" x="310">9</tspan></text>
    <text class="col7" x="360">ム<tspan dy="14" x="360">3</tspan><tspan dy="14" x="360">メ</tspan><tspan dy="14" x="360">7</tspan><tspan dy="14" x="360">モ</tspan><tspan dy="14" x="360">1</tspan><tspan dy="14" x="360">ヤ</tspan></text>
    <text class="col8 m-bright" x="410" font-size="14">ユ<tspan dy="14" x="410" class="m-mid">4</tspan><tspan dy="14" x="410" class="m-dim">ヨ</tspan><tspan dy="14" x="410" class="m-dim">6</tspan><tspan dy="14" x="410" class="m-dim">ラ</tspan><tspan dy="14" x="410" class="m-dim">2</tspan><tspan dy="14" x="410" class="m-dim">リ</tspan></text>
    <text class="col9"  x="460">ル<tspan dy="14" x="460">8</tspan><tspan dy="14" x="460">レ</tspan><tspan dy="14" x="460">0</tspan><tspan dy="14" x="460">ロ</tspan><tspan dy="14" x="460">5</tspan><tspan dy="14" x="460">ワ</tspan></text>
