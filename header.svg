<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      .m { font-family: 'Courier New', monospace; font-size: 13px; fill: #00FF41; }
      .m-dim { fill: #003B00; }
      .m-mid { fill: #00AA22; }
      .m-bright { fill: #00FF41; }
      @keyframes rain0 { 0%{opacity:0;transform:translateY(-220px)} 100%{opacity:1;transform:translateY(220px)} }
      @keyframes rain1 { 0%{opacity:0;transform:translateY(-220px)} 100%{opacity:1;transform:translateY(220px)} }
      @keyframes rain2 { 0%{opacity:0;transform:translateY(-220px)} 100%{opacity:1;transform:translateY(220px)} }
      @keyframes rain3 { 0%{opacity:0;transform:translateY(-220px)} 100%{opacity:1;transform:translateY(220px)} }
      .col0  { animation: rain0 2.1s linear infinite; animation-delay: 0.0s; }
      .col1  { animation: rain1 1.8s linear infinite; animation-delay: 0.3s; }
      .col2  { animation: rain2 2.4s linear infinite; animation-delay: 0.7s; }
      .col3  { animation: rain3 1.6s linear infinite; animation-delay: 1.1s; }
      .col4  { animation: rain0 2.2s linear infinite; animation-delay: 0.5s; }
      .col5  { animation: rain1 1.9s linear infinite; animation-delay: 1.4s; }
      .col6  { animation: rain2 2.6s linear infinite; animation-delay: 0.2s; }
      .col7  { animation: rain3 1.7s linear infinite; animation-delay: 0.9s; }
      .col8  { animation: rain0 2.3s linear infinite; animation-delay: 1.6s; }
      .col9  { animation: rain1 2.0s linear infinite; animation-delay: 0.4s; }
      .col10 { animation: rain2 1.5s linear infinite; animation-delay: 1.2s; }
      .col11 { animation: rain3 2.5s linear infinite; animation-delay: 0.6s; }
      .col12 { animation: rain0 1.8s linear infinite; animation-delay: 1.8s; }
      .col13 { animation: rain1 2.1s linear infinite; animation-delay: 0.1s; }
      .col14 { animation: rain2 1.6s linear infinite; animation-delay: 1.5s; }
      .col15 { animation: rain3 2.3s linear infinite; animation-delay: 0.8s; }
      .col16 { animation: rain0 2.0s linear infinite; animation-delay: 1.3s; }
      .col17 { animation: rain1 1.7s linear infinite; animation-delay: 0.2s; }
      @keyframes glow {
        0%,100% { filter: drop-shadow(0 0 8px #00FF41) drop-shadow(0 0 20px #00AA22); }
        50%      { filter: drop-shadow(0 0 18px #00FF41) drop-shadow(0 0 40px #00FF41); }
      }
      .title { animation: glow 3s ease-in-out infinite; }
      @keyframes fadeUp { 0%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0px)} }
      .subtitle { animation: fadeUp 1.5s ease-out forwards; animation-delay: 0.5s; opacity: 0; }
      @keyframes scan { 0%{transform:translateY(-5px);opacity:0.08} 50%{opacity:0.15} 100%{transform:translateY(220px);opacity:0.08} }
      .scanline { animation: scan 4s linear infinite; }
    </style>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="textglow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#003B00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
