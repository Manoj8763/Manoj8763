<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes titleGlow {
        0%,100% { filter: drop-shadow(0 0 8px #FF2D78) drop-shadow(0 0 20px #FF2D78); }
        50%      { filter: drop-shadow(0 0 20px #FF6EC7) drop-shadow(0 0 50px #FF2D78); }
      }
      @keyframes sunPulse {
        0%,100% { opacity: 0.9; }
        50%      { opacity: 1.0; }
      }
      @keyframes gridGlow {
        0%,100% { opacity: 0.5; }
        50%      { opacity: 0.9; }
      }
      @keyframes fadeDown {
        0%   { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanH {
        0%   { transform: translateY(130px); opacity: 0; }
        10%  { opacity: 0.6; }
        90%  { opacity: 0.6; }
        100% { transform: translateY(220px); opacity: 0; }
      }
      .title  { animation: titleGlow 2.5s ease-in-out infinite; }
      .sub    { animation: fadeDown 1.2s ease-out forwards; animation-delay: 0.5s; opacity: 0; }
      .grid   { animation: gridGlow 3s ease-in-out infinite; }
      .sun    { animation: sunPulse 2s ease-in-out infinite; }
      .scan   { animation: scanH 4s linear infinite; }
    </style>

    <!-- Sky gradient: dark purple top to dark bottom -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D0015"/>
      <stop offset="55%"  stop-color="#1A0030"/>
      <stop offset="100%" stop-color="#0A0020"/>
    </linearGradient>

    <!-- Ground gradient: dark purple to black -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A0030"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>

    <!-- Sun gradient: orange yellow to pink -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="30%"  stop-color="#FF8C00"/>
      <stop offset="60%"  stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#CC0055"/>
    </linearGradient>

    <!-- Sun clip (cuts into stripes) -->
    <clipPath id="sunClip">
      <circle cx="450" cy="148" r="52"/>
    </clipPath>

    <!-- Horizon glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%"   stop-color="#FF2D78" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </radialGradient>

    <!-- Title glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="30%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="148" fill="url(#sky)"/>

  <!-- Ground background -->
  <rect y="148" width="900" height="72" fill="url(#ground)"/>

  <!-- Horizon pink glow -->
  <rect y="130" width="900" height="40" fill="url(#horizonGlow)"/>

  <!-- RETRO SUN: circle with stripe mask -->
  <g class="sun">
    <circle cx="450" cy="148" r="52" fill="url(#sunGrad)"/>
    <!-- Black stripes over bottom half of sun -->
    <g clip-path="url(#sunClip)" fill="#0D0015">
      <rect x="370" y="148" width="160" height="4"/>
      <rect x="370" y="156" width="160" height="5"/>
      <rect x="370" y="165" width="160" height="6"/>
      <rect x="370" y="175" width="160" height="7"/>
      <rect x="370" y="186" width="160" height="8"/>
    </g>
  </g>

  <!-- PERSPECTIVE GRID — horizontal lines (ground) -->
  <g class="grid" stroke="#FF2D78" stroke-width="0.7" fill="none" opacity="0.7">
    <line x1="0" y1="148" x2="900" y2="148"/>
    <line x1="0" y1="158" x2="900" y2="158"/>
    <line x1="0" y1="170" x2="900" y2="170"/>
    <line x1="0" y1="183" x2="900" y2="183"/>
    <line x1="0" y1="198" x2="900" y2="198"/>
    <line x1="0" y1="215" x2="900" y2="215"/>
  </g>

  <!-- PERSPECTIVE GRID — vertical lines converging to horizon center -->
  <g class="grid" stroke="#9B00FF" stroke-width="0.8" fill="none" opacity="0.65">
    <line x1="450" y1="148" x2="0"   y2="220"/>
    <line x1="450" y1="148" x2="100" y2="220"/>
    <line x1="450" y1="148" x2="200" y2="220"/>
    <line x1="450" y1="148" x2="300" y2="220"/>
    <line x1="450" y1="148" x2="400" y2="220"/>
    <line x1="450" y1="148" x2="500" y2="220"/>
    <line x1="450" y1="148" x2="600" y2="220"/>
    <line x1="450" y1="148" x2="700" y2="220"/>
    <line x1="450" y1="148" x2="800" y2="220"/>
    <line x1="450" y1="148" x2="900" y2="220"/>
  </g>

  <!-- Thin scan line on ground -->
  <rect class="scan" x="0" width="900" height="1.5" fill="#FF2D78" opacity="0.5"/>

  <!-- Stars in sky -->
  <g fill="white" opacity="0.7">
    <circle cx="50"  cy="20"  r="1"/>
    <circle cx="140" cy="10"  r="0.8"/>
    <circle cx="220" cy="35"  r="1"/>
    <circle cx="310" cy="15"  r="0.8"/>
    <circle cx="390" cy="40"  r="0.7"/>
    <circle cx="510" cy="22"  r="1"/>
    <circle cx="600" cy="8"   r="0.8"/>
    <circle cx="680" cy="38"  r="1"/>
    <circle cx="770" cy="18"  r="0.8"/>
    <circle cx="860" cy="30"  r="1"/>
    <circle cx="100" cy="60"  r="0.7"/>
    <circle cx="280" cy="55"  r="0.8"/>
    <circle cx="470" cy="50"  r="0.7"/>
    <circle cx="650" cy="62"  r="0.8"/>
    <circle cx="830" cy="55"  r="0.7"/>
    <circle cx="30"  cy="90"  r="0.6"/>
    <circle cx="870" cy="85"  r="0.6"/>
  </g>

  <!-- Vignette -->
  <rect width="900" height="220" fill="url(#vignette)"/>

  <!-- NEON TITLE -->
  <text class="title" x="450" y="95" text-anchor="middle"
    font-family="ui-sans-serif, 'Arial Black', Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="4"
    fill="#FF2D78" filter="url(#glow)">
    MANOJ KUMAR PARIDA
  </text>

  <!-- Thin white outline version of title for depth -->
  <text x="450" y="95" text-anchor="middle"
    font-family="ui-sans-serif, 'Arial Black', Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="4"
    fill="none" stroke="white" stroke-width="0.5" opacity="0.3">
    MANOJ KUMAR PARIDA
  </text>

  <!-- Subtitle -->
  <text class="sub" x="450" y="130" text-anchor="middle"
    font-family="ui-sans-serif, Arial, sans-serif"
    font-size="14" font-weight="600" letter-spacing="3"
    fill="#E040FF">
    AI AGENT ENGINEER  |  GENAI ARCHITECT  |  IIT KANPUR
  </text>
</svg>
