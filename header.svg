      @keyframes s8  {0%,79.9%{opacity:0}80%,89.9%{opacity:1}90%,100%{opacity:0}}
      @keyframes s9  {0%,89.9%{opacity:0}90%,100%{opacity:1}}
      .s0{animation:s0 2s steps(1,end) infinite;}
      .s1{animation:s1 2s steps(1,end) infinite;}
      .s2{animation:s2 2s steps(1,end) infinite;}
      .s3{animation:s3 2s steps(1,end) infinite;}
      .s4{animation:s4 2s steps(1,end) infinite;}
      .s5{animation:s5 2s steps(1,end) infinite;}
      .s6{animation:s6 2s steps(1,end) infinite;}
      .s7{animation:s7 2s steps(1,end) infinite;}
      .s8{animation:s8 2s steps(1,end) infinite;}
