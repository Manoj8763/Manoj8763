<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes lf1 { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes lf2 { 0%,49%{opacity:0} 50%,100%{opacity:1} }
      .leg1 { animation: lf1 0.22s steps(1,end) infinite; }
      .leg2 { animation: lf2 0.22s steps(1,end) infinite; }
      @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      .dino { animation: bounce 0.22s ease-in-out infinite; }
      @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-1100px)} }
      .ca { animation: scroll 3.2s linear infinite; }
      .cb { animation: scroll 3.2s linear infinite; animation-delay: -1.07s; }
      .cc { animation: scroll 3.2s linear infinite; animation-delay: -2.13s; }
      @keyframes cscroll { from{transform:translateX(0)} to{transform:translateX(-1100px)} }
      .cl1 { animation: cscroll 14s linear infinite; animation-delay: 0s; }
      .cl2 { animation: cscroll 14s linear infinite; animation-delay: -7s; }
      @keyframes gscroll { from{transform:translateX(0)} to{transform:translateX(-150px)} }
      .gnd { animation: gscroll 0.9s linear infinite; }
      @keyframes s0  {0%,9.9%{opacity:1} 10%,100%{opacity:0}}
      @keyframes s1  {0%,9.9%{opacity:0} 10%,19.9%{opacity:1} 20%,100%{opacity:0}}
