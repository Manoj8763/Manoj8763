<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes pulse {
        0%,100% { r: 4; opacity: 0.6; }
        50%      { r: 7; opacity: 1.0; }
      }
      @keyframes pulse2 {
        0%,100% { r: 3; opacity: 0.4; }
        50%      { r: 6; opacity: 0.9; }
      }
      @keyframes flowLine {
        0%   { stroke-dashoffset: 200; opacity: 0.1; }
        50%  { opacity: 0.6; }
        100% { stroke-dashoffset: 0;   opacity: 0.1; }
      }
      @keyframes flowLine2 {
        0%   { stroke-dashoffset: 0;   opacity: 0.1; }
        50%  { opacity: 0.5; }
        100% { stroke-dashoffset: 200; opacity: 0.1; }
      }
      @keyframes titleGlow {
        0%,100% { filter: drop-shadow(0 0 6px #00D4FF) drop-shadow(0 0 16px #0088CC); }
        50%      { filter: drop-shadow(0 0 14px #00D4FF) drop-shadow(0 0 32px #00BBFF); }
      }
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0);   }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      .node1 { animation: pulse  2.0s ease-in-out infinite; }
      .node2 { animation: pulse  2.8s ease-in-out infinite; animation-delay: 0.4s; }
      .node3 { animation: pulse  1.8s ease-in-out infinite; animation-delay: 0.9s; }
      .node4 { animation: pulse2 2.5s ease-in-out infinite; animation-delay: 0.2s; }
      .node5 { animation: pulse2 2.2s ease-in-out infinite; animation-delay: 1.1s; }
      .node6 { animation: pulse  3.0s ease-in-out infinite; animation-delay: 0.6s; }
      .node7 { animation: pulse2 1.9s ease-in-out infinite; animation-delay: 1.4s; }
      .node8 { animation: pulse  2.4s ease-in-out infinite; animation-delay: 0.3s; }
      .node9 { animation: pulse2 2.7s ease-in-out infinite; animation-delay: 0.8s; }
      .node10{ animation: pulse  2.1s ease-in-out infinite; animation-delay: 1.2s; }
      .node11{ animation: pulse2 2.6s ease-in-out infinite; animation-delay: 0.5s; }
      .node12{ animation: pulse  1.7s ease-in-out infinite; animation-delay: 1.6s; }
      .line1 { animation: flowLine  3.0s linear infinite; }
      .line2 { animation: flowLine2 2.5s linear infinite; animation-delay: 0.5s; }
      .line3 { animation: flowLine  2.8s linear infinite; animation-delay: 1.0s; }
      .line4 { animation: flowLine2 3.2s linear infinite; animation-delay: 0.3s; }
      .line5 { animation: flowLine  2.3s linear infinite; animation-delay: 1.4s; }
      .line6 { animation: flowLine2 2.9s linear infinite; animation-delay: 0.7s; }
      .line7 { animation: flowLine  3.1s linear infinite; animation-delay: 0.2s; }
      .line8 { animation: flowLine2 2.6s linear infinite; animation-delay: 1.1s; }
      .line9 { animation: flowLine  2.4s linear infinite; animation-delay: 0.9s; }
      .title    { animation: titleGlow 3s ease-in-out infinite; }
      .subtitle { animation: fadeUp 1.2s ease-out forwards; animation-delay: 0.6s; opacity: 0; }
      .cursor   { animation: blink 1s step-end infinite; }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#001830" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bgGlow)"/>

  <g stroke="#00D4FF" stroke-width="0.8" fill="none" stroke-dasharray="8 12" opacity="0.4">
    <line class="line1" x1="55"  y1="30"  x2="190" y2="90"/>
    <line class="line2" x1="190" y1="90"  x2="320" y2="45"/>
    <line class="line3" x1="320" y1="45"  x2="450" y2="110"/>
    <line class="line4" x1="450" y1="110" x2="600" y2="55"/>
    <line class="line5" x1="600" y1="55"  x2="750" y2="95"/>
    <line class="line6" x1="750" y1="95"  x2="860" y2="40"/>
    <line class="line7" x1="55"  y1="30"  x2="100" y2="170"/>
    <line class="line8" x1="100" y1="170" x2="280" y2="190"/>
    <line class="line9" x1="280" y1="190" x2="450" y2="110"/>
  </g>

  <g stroke="#0088CC" stroke-width="0.6" fill="none" stroke-dasharray="6 14" opacity="0.35">
    <line class="line2" x1="190" y1="90"  x2="280" y2="190"/>
    <line class="line3" x1="320" y1="45"  x2="500" y2="180"/>
    <line class="line5" x1="500" y1="180" x2="650" y2="200"/>
    <line class="line6" x1="650" y1="200" x2="800" y2="160"/>
    <line class="line7" x1="800" y1="160" x2="860" y2="40"/>
    <line class="line1" x1="600" y1="55"  x2="500" y2="180"/>
    <line class="line4" x1="750" y1="95"  x2="800" y2="160"/>
    <line class="line9" x1="100" y1="170" x2="55"  y2="30"/>
  </g>

  <g fill="#00D4FF" filter="url(#nodeGlow)">
    <circle class="node1"  cx="55"  cy="30"  r="4"/>
    <circle class="node2"  cx="190" cy="90"  r="5"/>
    <circle class="node3"  cx="320" cy="45"  r="4"/>
    <circle class="node4"  cx="450" cy="110" r="6"/>
    <circle class="node5"  cx="600" cy="55"  r="4"/>
    <circle class="node6"  cx="750" cy="95"  r="5"/>
    <circle class="node7"  cx="860" cy="40"  r="3"/>
    <circle class="node8"  cx="100" cy="170" r="4"/>
    <circle class="node9"  cx="280" cy="190" r="3"/>
    <circle class="node10" cx="500" cy="180" r="4"/>
    <circle class="node11" cx="650" cy="200" r="3"/>
    <circle class="node12" cx="800" cy="160" r="4"/>
  </g>

  <g fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3">
    <circle cx="450" cy="110" r="12"/>
    <circle cx="190" cy="90"  r="9"/>
    <circle cx="750" cy="95"  r="9"/>
  </g>

  <rect width="900" height="220" fill="url(#vignette)"/>

  <text class="title" x="450" y="105" text-anchor="middle"
    font-family="ui-sans-serif, Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="3"
    fill="white">
    MANOJ KUMAR PARIDA
  </text>

  <text class="subtitle" x="450" y="148" text-anchor="middle"
    font-family="ui-monospace, 'Courier New', monospace"
    font-size="15" letter-spacing="1.5"
    fill="#00D4FF">
    AI Agent Engineer | GenAI Architect | IIT Kanpur<tspan class="cursor" fill="#00D4FF">▌</tspan>
  </text>

  <line x1="200" y1="172" x2="700" y2="172" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
</svg>
