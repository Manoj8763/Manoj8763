    <text class="col12" x="610">カ<tspan dy="14" x="610">8</tspan><tspan dy="14" x="610">キ</tspan><tspan dy="14" x="610">1</tspan><tspan dy="14" x="610">ク</tspan><tspan dy="14" x="610">5</tspan><tspan dy="14" x="610">ケ</tspan></text>
    <text class="col13" x="660">0<tspan dy="14" x="660">コ</tspan><tspan dy="14" x="660">9</tspan><tspan dy="14" x="660">サ</tspan><tspan dy="14" x="660">4</tspan><tspan dy="14" x="660">シ</tspan><tspan dy="14" x="660">7</tspan></text>
    <text class="col14" x="710">ス<tspan dy="14" x="710">2</tspan><tspan dy="14" x="710">セ</tspan><tspan dy="14" x="710">8</tspan><tspan dy="14" x="710">ソ</tspan><tspan dy="14" x="710">3</tspan><tspan dy="14" x="710">タ</tspan></text>
    <text class="col15" x="760">1<tspan dy="14" x="760">チ</tspan><tspan dy="14" x="760">6</tspan><tspan dy="14" x="760">ツ</tspan><tspan dy="14" x="760">0</tspan><tspan dy="14" x="760">テ</tspan><tspan dy="14" x="760">5</tspan></text>
    <text class="col16" x="810">ト<tspan dy="14" x="810">7</tspan><tspan dy="14" x="810">ナ</tspan><tspan dy="14" x="810">2</tspan><tspan dy="14" x="810">ニ</tspan><tspan dy="14" x="810">9</tspan><tspan dy="14" x="810">ヌ</tspan></text>
    <text class="col17" x="860">4<tspan dy="14" x="860">ネ</tspan><tspan dy="14" x="860">8</tspan><tspan dy="14" x="860">ノ</tspan><tspan dy="14" x="860">1</tspan><tspan dy="14" x="860">ハ</tspan><tspan dy="14" x="860">6</tspan></text>
  </g>
  <rect width="900" height="220" fill="url(#vignette)"/>
  <rect width="900" height="220" fill="url(#textglow)"/>
  <rect class="scanline" width="900" height="3" fill="#00FF41" y="0"/>
  <text class="title" x="450" y="108" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
