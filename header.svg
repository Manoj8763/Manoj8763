<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <style>
      @keyframes signal {
        0%   { stroke-dashoffset: 300; opacity: 0.2; }
        50%  { opacity: 1; }
        100% { stroke-dashoffset: 0;   opacity: 0.2; }
      }
      @keyframes signal2 {
        0%   { stroke-dashoffset: 0;   opacity: 0.2; }
        50%  { opacity: 1; }
        100% { stroke-dashoffset: 300; opacity: 0.2; }
      }
      @keyframes nodePulse {
        0%,100% { r: 3; opacity: 0.5; }
        50%      { r: 5; opacity: 1.0; }
      }
      @keyframes chipGlow {
        0%,100% { opacity: 0.6; filter: drop-shadow(0 0 3px #00FFD4); }
        50%      { opacity: 1.0; filter: drop-shadow(0 0 8px #00FFD4); }
      }
      @keyframes titleGlow {
        0%,100% { filter: drop-shadow(0 0 6px #00FFD4) drop-shadow(0 0 18px #00AAAA); }
        50%      { filter: drop-shadow(0 0 16px #00FFD4) drop-shadow(0 0 40px #00FFD4); }
      }
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%,100% { opacity:1; } 50% { opacity:0; }
      }
      .sig1  { animation: signal  2.2s linear infinite; }
      .sig2  { animation: signal2 1.9s linear infinite; animation-delay:0.4s; }
      .sig3  { animation: signal  2.7s linear infinite; animation-delay:0.8s; }
      .sig4  { animation: signal2 2.0s linear infinite; animation-delay:1.2s; }
      .sig5  { animation: signal  1.8s linear infinite; animation-delay:0.3s; }
      .sig6  { animation: signal2 2.5s linear infinite; animation-delay:0.9s; }
      .sig7  { animation: signal  2.3s linear infinite; animation-delay:1.5s; }
      .sig8  { animation: signal2 2.1s linear infinite; animation-delay:0.6s; }
      .sig9  { animation: signal  1.7s linear infinite; animation-delay:1.1s; }
      .sig10 { animation: signal2 2.8s linear infinite; animation-delay:0.2s; }
      .nd    { animation: nodePulse 2s ease-in-out infinite; }
      .nd2   { animation: nodePulse 2.6s ease-in-out infinite; animation-delay:0.5s; }
      .nd3   { animation: nodePulse 1.8s ease-in-out infinite; animation-delay:1.0s; }
      .chip  { animation: chipGlow 2.5s ease-in-out infinite; }
      .chip2 { animation: chipGlow 3.0s ease-in-out infinite; animation-delay:1.0s; }
      .title { animation: titleGlow 3s ease-in-out infinite; }
      .sub   { animation: fadeUp 1.2s ease-out forwards; animation-delay:0.6s; opacity:0; }
      .cur   { animation: blink 1s step-end infinite; }
    </style>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#001A1A"/>
      <stop offset="100%" stop-color="#000A0A"/>
    </radialGradient>

    <!-- Chip gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#003330"/>
      <stop offset="100%" stop-color="#001A18"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="20%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- ========== CIRCUIT TRACES ========== -->
  <!-- All traces: teal #00FFD4, animated dash flow -->
  <g stroke="#00FFD4" fill="none" stroke-dasharray="10 15">

    <!-- LEFT SIDE TRACES -->
    <polyline class="sig1"  stroke-width="1.2"
      points="0,40 60,40 60,80 120,80"/>
    <polyline class="sig2"  stroke-width="1.0"
      points="0,90 40,90 40,130 100,130 100,160 140,160"/>
    <polyline class="sig3"  stroke-width="1.2"
      points="0,170 50,170 50,140 110,140 110,100 160,100"/>
    <polyline class="sig4"  stroke-width="0.8"
      points="20,0 20,55 75,55 75,90"/>
    <polyline class="sig5"  stroke-width="1.0"
      points="0,200 70,200 70,175 130,175"/>

    <!-- RIGHT SIDE TRACES -->
    <polyline class="sig6"  stroke-width="1.2"
      points="900,35 840,35 840,75 780,75"/>
    <polyline class="sig7"  stroke-width="1.0"
      points="900,100 860,100 860,130 800,130 800,155 760,155"/>
    <polyline class="sig8"  stroke-width="1.2"
      points="900,175 830,175 830,145 770,145 770,110 730,110"/>
    <polyline class="sig9"  stroke-width="0.8"
      points="880,0 880,50 820,50 820,80"/>
    <polyline class="sig10" stroke-width="1.0"
      points="900,205 840,205 840,180 770,180"/>

    <!-- BOTTOM CONNECTING TRACES -->
    <polyline class="sig3"  stroke-width="0.7"
      points="150,220 150,195 220,195 220,210"/>
    <polyline class="sig1"  stroke-width="0.7"
      points="700,220 700,195 760,195 760,210"/>
  </g>

  <!-- Small connecting dots (vias) on traces -->
  <g fill="#00FFD4" filter="url(#glow)">
    <!-- Left cluster -->
    <circle class="nd"  cx="60"  cy="80"  r="3"/>
    <circle class="nd2" cx="120" cy="80"  r="3"/>
    <circle class="nd3" cx="40"  cy="130" r="3"/>
    <circle class="nd"  cx="100" cy="130" r="3"/>
    <circle class="nd2" cx="110" cy="100" r="3"/>
    <circle class="nd3" cx="50"  cy="170" r="3"/>
    <circle class="nd"  cx="75"  cy="90"  r="3"/>
    <circle class="nd2" cx="70"  cy="175" r="3"/>
    <!-- Right cluster -->
    <circle class="nd"  cx="840" cy="75"  r="3"/>
    <circle class="nd3" cx="780" cy="75"  r="3"/>
    <circle class="nd2" cx="860" cy="130" r="3"/>
    <circle class="nd"  cx="800" cy="155" r="3"/>
    <circle class="nd3" cx="820" cy="80"  r="3"/>
    <circle class="nd2" cx="830" cy="145" r="3"/>
    <circle class="nd"  cx="770" cy="110" r="3"/>
    <circle class="nd3" cx="840" cy="180" r="3"/>
  </g>

  <!-- ===== LEFT MICROCHIP ===== -->
  <g class="chip" transform="translate(130,55)">
    <!-- Chip body -->
    <rect x="0" y="0" width="55" height="55" rx="3"
      fill="url(#chipGrad)" stroke="#00FFD4" stroke-width="1"/>
    <!-- Inner die -->
    <rect x="8" y="8" width="39" height="39" rx="1"
      fill="none" stroke="#00FFD4" stroke-width="0.5" opacity="0.5"/>
    <!-- Grid pattern inside -->
    <line x1="8" y1="27" x2="47" y2="27" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="8" y1="19" x2="47" y2="19" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="8" y1="35" x2="47" y2="35" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="27" y1="8" x2="27" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="19" y1="8" x2="19" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="35" y1="8" x2="35" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <!-- Corner dot -->
    <circle cx="12" cy="12" r="2" fill="#00FFD4" opacity="0.8"/>
    <!-- Chip pins left -->
    <line x1="-8" y1="14" x2="0" y2="14" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="22" x2="0" y2="22" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="30" x2="0" y2="30" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="38" x2="0" y2="38" stroke="#00FFD4" stroke-width="1.2"/>
    <!-- Chip pins right -->
    <line x1="55" y1="14" x2="63" y2="14" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="22" x2="63" y2="22" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="63" y2="30" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="38" x2="63" y2="38" stroke="#00FFD4" stroke-width="1.2"/>
    <!-- Chip pins top -->
    <line x1="14" y1="-8" x2="14" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="27" y1="-8" x2="27" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="40" y1="-8" x2="40" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <!-- Label -->
    <text x="27" y="32" text-anchor="middle"
      font-family="monospace" font-size="8" fill="#00FFD4" opacity="0.9">AI-01</text>
  </g>

  <!-- ===== RIGHT MICROCHIP ===== -->
  <g class="chip2" transform="translate(715,60)">
    <rect x="0" y="0" width="55" height="55" rx="3"
      fill="url(#chipGrad)" stroke="#00FFD4" stroke-width="1"/>
    <rect x="8" y="8" width="39" height="39" rx="1"
      fill="none" stroke="#00FFD4" stroke-width="0.5" opacity="0.5"/>
    <line x1="8" y1="27" x2="47" y2="27" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="8" y1="19" x2="47" y2="19" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="8" y1="35" x2="47" y2="35" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="27" y1="8" x2="27" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="19" y1="8" x2="19" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <line x1="35" y1="8" x2="35" y2="47" stroke="#00FFD4" stroke-width="0.4" opacity="0.4"/>
    <circle cx="12" cy="12" r="2" fill="#00FFD4" opacity="0.8"/>
    <line x1="-8" y1="14" x2="0" y2="14" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="22" x2="0" y2="22" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="30" x2="0" y2="30" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="-8" y1="38" x2="0" y2="38" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="14" x2="63" y2="14" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="22" x2="63" y2="22" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="63" y2="30" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="55" y1="38" x2="63" y2="38" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="14" y1="-8" x2="14" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="27" y1="-8" x2="27" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <line x1="40" y1="-8" x2="40" y2="0" stroke="#00FFD4" stroke-width="1.2"/>
    <text x="27" y="32" text-anchor="middle"
      font-family="monospace" font-size="8" fill="#00FFD4" opacity="0.9">AI-02</text>
  </g>

  <!-- Vignette -->
  <rect width="900" height="220" fill="url(#vig)"/>

  <!-- TITLE -->
  <text class="title" x="450" y="105" text-anchor="middle"
    font-family="ui-sans-serif, Arial, sans-serif"
    font-size="46" font-weight="900" letter-spacing="3"
    fill="white" filter="url(#strongGlow)">
    MANOJ KUMAR PARIDA
  </text>

  <!-- SUBTITLE -->
  <text class="sub" x="450" y="148" text-anchor="middle"
    font-family="ui-monospace, 'Courier New', monospace"
    font-size="14" letter-spacing="2"
    fill="#00FFD4">
    &gt; AI Agent Engineer | GenAI Architect | IIT Kanpur<tspan class="cur">_</tspan>
  </text>

  <!-- Bottom accent line -->
  <line x1="220" y1="168" x2="680" y2="168"
    stroke="#00FFD4" stroke-width="0.6" opacity="0.4"/>
</svg>
