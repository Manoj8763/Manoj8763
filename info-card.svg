<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 360" width="510" height="360">
  <style>
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; ry: 10px; }
    .title { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: bold; }
    .sep { fill: #30363d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .key { fill: #79c0ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: bold; }
    .val { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .line { opacity: 0; animation: fadeInLine 0.5s ease-out forwards; }
    @keyframes fadeInLine {
      0% { opacity: 0; transform: translateX(-10px); }
      100% { opacity: 1; transform: translateX(0); }
    }
  </style>
